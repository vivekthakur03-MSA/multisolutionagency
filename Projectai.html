<style>
/* Robotic Modal Overlay */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(3, 12, 41, 0.95);
  z-index: 1000; display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(10px);
}
.modal-content {
  background: #fff; width: min(800px, 95%); max-height: 85vh; 
  border-radius: 20px; position: relative; overflow-y: auto;
  border: 2px solid var(--gold);
  transform: translateY(50px) scale(0.9); opacity: 0;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-content.active { transform: translateY(0) scale(1); opacity: 1; }

.modal-header { background: var(--navy); color: #fff; padding: 25px; }
.modal-body { padding: 30px; line-height: 1.8; }

/* Robotic lines animation */
.modal-content::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
  background: var(--gold); box-shadow: 0 0 15px var(--gold);
  animation: scan-line 2s linear infinite;
}
@keyframes scan-line { 0% { top: 0; } 100% { top: 100%; opacity: 0;} }

.contact-block {
  background: var(--sky); border: 1px solid var(--line);
  padding: 20px; border-radius: 15px; margin-top: 30px;
}
.contact-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: 600; color: var(--navy); }
.contact-item svg { width: 20px; height: 20px; fill: var(--blue); }
</style>

<!-- Detail Modal structure -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content" id="modalBox">
    <div class="modal-header">
      <h2 id="mTitle">Project Title</h2>
      <button onclick="closeDetails()" style="position:absolute; right:20px; top:20px; background:none; border:none; color:#fff; font-size:2rem; cursor:pointer">&times;</button>
    </div>
    <div class="modal-body">
      <div id="mDesc">Description goes here...</div>
      <div class="contact-block">
        <h4 style="margin-bottom:15px">Contact Information:</h4>
        <div class="contact-item">📧 connect@multisolutionagency.in</div>
        <div class="contact-item">🔗 <a href="https://www.linkedin.com/company/multisolution-agency/" target="_blank" style="color:var(--blue)">linkedin.com/msa</a></div>
        <div class="contact-item">💬 <a href="https://chat.whatsapp.com/IH5iKda2vhbHXo5w8ZxIlA" target="_blank" style="color:var(--green)">WhatsApp Support</a></div>
      </div>
    </div>
  </div>
</div>

<script>
// Logic to show modal
window.showDetails = (title, desc) => {
  document.getElementById('mTitle').innerText = title;
  // Regex to convert links in text to clickable <a> tags
  const linkedText = desc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--blue);text-decoration:underline">$1</a>');
  document.getElementById('mDesc').innerHTML = linkedText;
  
  const m = document.getElementById('detailModal');
  m.style.display = 'flex';
  setTimeout(() => document.getElementById('modalBox').classList.add('active'), 10);
};

window.closeDetails = () => {
  document.getElementById('modalBox').classList.remove('active');
  setTimeout(() => document.getElementById('detailModal').style.display = 'none', 400);
}
</script>
